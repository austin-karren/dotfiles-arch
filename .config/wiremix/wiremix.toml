# overwrites default wiremix configuration
# defaults: https://github.com/tsowell/wiremix/blob/main/wiremix.toml
#
# Adopted from Omarchy (config/wiremix/wiremix.toml) so the one line below survives
# an update. It was byte-identical to Omarchy's copy until then; everything except
# `tab` is still theirs.

# Open on Output rather than Playback, which is both wiremix's default and Omarchy's.
# The question that sends you to this TUI is almost always "which device is the sound
# coming out of" -- speakers, the monitor over HDMI, bluetooth earbuds -- and that is
# the Output tab. Playback lists per-application streams, which is the rarer question
# and one keypress away on F1.
#
# Applies everywhere wiremix is launched, not just the Waybar headphones icon: the
# Omarchy menu's audio entry and any future keybind go through the same binary. That
# is the reason this is config rather than a `-v output` flag on the bar module.
tab = "output"

[char_sets.default]
default_device = "⮞"
