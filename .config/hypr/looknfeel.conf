# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # Uniform 8px of background everywhere: at the screen edge you see gaps_out,
    # between two windows you see gaps_in twice. Keep gaps_out = 2 x gaps_in.
    gaps_out = 8
    gaps_in = 4

    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Slightly round window corners (default: 0)
    rounding = 6

    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15

    # Omarchy defaults to range = 2, which is too short for the shadow to fade
    # out - it renders as a hard near-black line around every window instead.
    # Off keeps the edges clean against the 8px gaps.
    shadow {
        enabled = false

        # For a real soft shadow instead, use these (bleeds into the gaps):
        # enabled = true
        # range = 15
        # render_power = 3
        # color = rgba(1a1a1a99)
    }
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no

    # Special workspaces drop in from the TOP and retract back up into the waybar,
    # instead of Omarchy's default of rising from the bottom and falling back down.
    # Makes the calendar popup read as emerging from the bar that launched it.
    #
    # THE DIRECTION ARGUMENT MEANS OPPOSITE THINGS ON THE TWO TREES. It is
    # undocumented on the wiki's animations page, so this was measured rather than
    # assumed -- animation slowed to 5s, popup toggled over an empty workspace so only
    # it could change between frames, and the window's bounding box tracked per frame:
    #
    #   specialWorkspaceOut, slidevert top     -> top edge 53 -> 475, bottom clipped
    #                                             = slides DOWN. Same as no argument.
    #   specialWorkspaceOut, slidevert bottom  -> bottom edge 2560 -> 1796, top pinned
    #                                             at 53 (the waybar's 32 logical px)
    #                                             = slides UP. What we want.
    #
    # So `top` for In, `bottom` for Out. Do not "fix" this to match.
    #
    # NOTE: these are global animation trees -- there is no per-workspace override, so
    # the SUPER+S scratchpad now moves the same way.
    #
    # Duration 3 (=300ms) and easeOutQuint are kept from the Omarchy default so the
    # popup still matches the rest of the desktop's motion.
    animation = specialWorkspaceIn, 1, 3, easeOutQuint, slidevert top
    animation = specialWorkspaceOut, 1, 3, easeOutQuint, slidevert bottom
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
