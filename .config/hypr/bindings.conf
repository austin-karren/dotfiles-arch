# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# macOS-Spaces-style workspace switching.
# CTRL+SUPER+Left/Right were bound to changegroupactive (cycle tabs within a
# window group), so they must be unbound first.
# e+1/e-1 hops between workspaces that actually have windows, skipping empty
# ones - same behaviour as the existing SUPER + mouse wheel binding.
unbind = CTRL SUPER, LEFT
unbind = CTRL SUPER, RIGHT
bindd = CTRL SUPER, LEFT, Previous workspace, workspace, e-1
bindd = CTRL SUPER, RIGHT, Next workspace, workspace, e+1

# macOS Cmd+Q. Omarchy gives SUPER+W = close window (killactive, a compositor
# level close request), but leaves app-level quit on each app's native CTRL+Q -
# which is the inconsistency. sendshortcut retypes the keystroke into the
# focused window, so SUPER+Q arrives at the app as the CTRL+Q it understands.
bindd = SUPER, Q, Quit app, sendshortcut, CTRL, Q, activewindow

# macOS Cmd+W. Omarchy binds SUPER+W to killactive (tiling-v2.conf), which is a
# COMPOSITOR-level close: it takes the whole window and cannot see the splits, tabs
# or documents inside it. macOS cmd+w is APP-level, so it walks a ladder -
# pane, then tab, then window - and only closes the window when nothing smaller is
# left. close-surface restores that by retyping each app's own close-smallest-unit
# shortcut into it, falling back to killactive for apps it does not recognise.
#
# Not one binding for every app, because CTRL+W is not universal: inside a terminal
# it is readline's delete-word, which is why Ghostty uses CTRL+SHIFT+W. The mapping
# lives in the script.
unbind = SUPER, W
bindd = SUPER, W, Close pane or window, exec, close-surface

# CTRL+Q as a second name for "close this window", so the same reflex works whether
# the app happens to implement a native quit or not.
#
# This is now deliberately NOT the same as SUPER+W, and the split matches both macOS
# and GNOME: W closes the smallest unit, Q closes the whole thing.
#   CTRL+Q   killactive                 - close this window
#   SUPER+Q  sendshortcut CTRL+Q        - ask the app to quit itself
#   SUPER+W  close-surface              - close the innermost pane/tab, else window
#
# TRADE-OFF: a compositor-level bind consumes the key before the focused app sees it,
# so NO application can receive CTRL+Q from the keyboard any more. That matters most
# in terminals, where CTRL+Q reaches a TUI (and is XON under legacy flow control) --
# pressing it in a terminal now closes the terminal and takes the shell with it.
# SUPER+Q below is the escape hatch: it re-sends CTRL+Q into the window, so it is the
# way to deliver a real app-level quit.
bindd = CTRL, Q, Close window, killactive,

# Last resort for windows that ignore both SUPER+W and SUPER+Q: SIGKILL.
# No save prompt, no cleanup - unsaved work in that app is lost.
bindd = SUPER SHIFT, Q, Force kill window, forcekillactive,

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# App launcher moves to ALT+SPACE (was SUPER+SPACE), freeing SUPER+SPACE for the
# Omarchy menu so it does not need a waybar click.
# SUPER ALT, SPACE is left bound to the menu as well, so old muscle memory works.
unbind = SUPER, SPACE
bindd = SUPER, SPACE, System palette, exec, quick-menu
bindd = ALT, SPACE, Launch apps, exec, omarchy-launch-walker

# Wallpaper picker on a letter key. W = wallpaper; every other W combo is taken
# (close window / wifi / weather / Typora), so SUPER ALT is the free slot.
# SUPER CTRL, SPACE stays bound to this too - it is the Omarchy default.
bindd = SUPER ALT, W, Wallpaper picker, exec, omarchy-menu background

# The system palette earns SUPER+SPACE; the Omarchy menu is now the rarer trip,
# so it moves here. (This chord previously held the background menu, which lives
# on SUPER ALT, W.)
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Omarchy menu, exec, omarchy-menu

# Omarchy's own default chord for its menu - redundant now that it lives on
# SUPER CTRL, SPACE. Freed for future use.
unbind = SUPER ALT, SPACE

# Floating placement (ADR-0024). A different MODE, not a different intensity, so it
# gets its own modifier set rather than competing with the window/workspace tiers
# above. All five no-op on tiled windows.
#
# Centre is on C, not SUPER+C: Omarchy binds SUPER+C to Universal copy
# (sendshortcut CTRL+Insert, the macOS Cmd+C reflex), and taking it would break copy
# in every application.
#
# UP fills rather than taking the top half, which is the one asymmetry here - it is
# the more useful action and the requested one. DOWN keeps the bottom half so the
# halves are still reachable.
bindd = SUPER CTRL ALT, LEFT, Float left half, exec, float-snap left
bindd = SUPER CTRL ALT, RIGHT, Float right half, exec, float-snap right
bindd = SUPER CTRL ALT, UP, Float fill screen, exec, float-snap up
bindd = SUPER CTRL ALT, DOWN, Float bottom half, exec, float-snap down
bindd = SUPER CTRL ALT, C, Float centre, exec, float-snap center

# Size ladder: step the focused window through 1/3, 1/2, 2/3 of the screen. Works on
# tiled windows (by moving the split boundary) and floating ones (directly).
# Left/right act on width, up/down on height, and the key's direction is spatial -
# right widens, down heightens - so a key never means two things.
#
# Which windows absorb the change is decided by the split boundary, not by counting
# windows: focus a window in a stacked column and the whole column resizes. See
# ADR-0022 - and `window-resize --toggle-mode` switches wrap/clamp at the ladder ends.
#
# ARROW MODIFIER SCHEME (ADR-0023). The modifier says what you are acting on:
#   SUPER            navigate - move focus, change nothing
#   SUPER+SHIFT/ALT  act on the window       (SHIFT swaps it, ALT resizes it)
#   SUPER+CTRL       leave the window        (switch workspace)
# Count carries intensity, the letter carries the axis.
#
# This takes SUPER+ALT+arrows from "move window to group". Hyprland window groups are
# not used here - CTRL+SUPER+left/right, which cycled tabs *within* a group, was
# already unbound above to make room for workspace switching.
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN
bindd = SUPER ALT, LEFT, Narrower, exec, window-resize left
bindd = SUPER ALT, RIGHT, Wider, exec, window-resize right
bindd = SUPER ALT, UP, Shorter, exec, window-resize up
bindd = SUPER ALT, DOWN, Taller, exec, window-resize down

