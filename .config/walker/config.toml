force_keyboard_focus = true                                                 # forces keyboard forcus to stay in Walker
selection_wrap = true                                                       # wrap list if at bottom or top
theme = "omarchy-custom"                                                    # theme to use (fork of omarchy-default in ~/.config/walker/themes/)
additional_theme_location = "~/.local/share/omarchy/default/walker/themes/"
hide_action_hints = true                                                    # globally hide the action hints

[placeholders]
"default" = { input = " Search...", list = "No Results" } # placeholders for input and empty list, key is the providers name, so f.e. "desktopapplications" or "menus:other"

[keybinds]
quick_activate = []

[columns]
symbols = 1 # providers to be queried by default

[providers]
max_results = 256 # 256 should be enough for everyone
# menus:palette is this rice's system palette (see .config/elephant/menus/palette.lua).
# Listing it here is what merges commands and applications into ONE list, replacing the
# old split between the launcher and a separate quick menu. Order in this list does NOT
# affect display order - Walker sorts an empty query across all providers - the palette
# comes first because its provider sets FixedOrder.
default = [
  "menus:palette",
  "desktopapplications",
  "websearch",
]

# Walker queries a DIFFERENT provider list when the input is empty, and its shipped
# default is `empty = ["desktopapplications"]` - applications only. Without this line the
# palette is invisible until you type a character, which looks exactly like the provider
# being broken. `default` above does not cover it.
empty = [
  "menus:palette",
  "desktopapplications",
]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[emergencies]]
text = "Restart Walker"
command = "omarchy-restart-walker"
